services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-booking-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-GymBookingAPI}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-gym_booking}
      DB_USERNAME: ${DB_USERNAME:-gym_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      CACHE_STORE: ${CACHE_STORE:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: gym-booking-db
    restart: unless-stopped
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gym_booking}
      MYSQL_USER: ${DB_USERNAME:-gym_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: gym-booking-swagger
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
    volumes:
      - ./src/openapi.yaml:/tmp/openapi.yaml:ro
    depends_on:
      - app

volumes:
  db_data:
